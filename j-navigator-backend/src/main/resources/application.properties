# 数据库连接地址 (如果你在 Navicat 里创建的数据库叫 travel，就把末尾的 j_navigator 改掉)
spring.datasource.url=jdbc:mysql://localhost:3306/jp_travel_db?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf-8
# 数据库用户名 (通常默认是 root)
spring.datasource.username=root
# 数据库密码 (填你安装 MySQL 时设置的密码)
spring.datasource.password=ZhangHao
# 数据库驱动
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 自动更新数据库表结构
spring.jpa.hibernate.ddl-auto=update
# 在控制台显示执行的 SQL 语句
spring.jpa.show-sql=true